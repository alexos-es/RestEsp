<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Restauración española</title>
  <link rel="stylesheet" href="./estilos-minimal.css">
  <style>
    .portada-hero {
      display:grid;
      grid-template-rows:1fr auto 1fr;
      min-height:100vh;
      min-height:100svh;
      color:#fff;
      position:relative;
      isolation:isolate;
      background:#292a28;
    }
    .portada-hero::before,
    .portada-hero::after {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
    }
    .portada-hero::before {
      z-index:-2;
      background:url("./toledo.jpg") center 46% / cover no-repeat;
      filter:grayscale(100%) sepia(45%) saturate(82%) contrast(108%);
    }
    .portada-hero::after {
      z-index:-1;
      background:
        linear-gradient(180deg,#211f261a 0%,#24222480 48%,#19191bef 100%),
        radial-gradient(ellipse at 72% 0%,#f4c17f99 0%,#c8975e55 30%,transparent 67%);
    }
    .hero-titulo,
    .hero-contenido .lema {
      text-shadow:0 2px 14px #161515c0;
    }
    .hero-contenido {
      grid-row:2;
      padding:clamp(1.5rem,5vh,3.5rem) 1rem;
      text-align:center;
    }
    .hero-emblema { width:clamp(6rem,16vmin,11rem); margin:0 auto clamp(1rem,3vh,2rem); }
    .hero-titulo {
      margin:0;
      font:700 clamp(1.95rem,6.55vw,6rem)/1.06 Georgia,"Times New Roman",serif;
      letter-spacing:-.035em;
      text-wrap:balance;
    }
    .hero-inicial { display:inline-block; width:.81em; height:.72em; vertical-align:baseline; fill:currentColor; }
    .hero-contenido .lema { margin-top:.85rem; }
    .portada-hero .pie { grid-row:3; align-self:end; color:inherit; background:transparent; border:0; padding-bottom:max(.85rem,env(safe-area-inset-bottom)); }
    .portada-hero .pie a { display:inline-block; }
  </style>
</head>
<body class="portada-hero">
  <main class="hero-contenido" aria-labelledby="titulo">
